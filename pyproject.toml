[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scadustats"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Adriano Oliveira @adri0", email = "" },
]
dependencies = [
    "yt-dlp>=2026.8",
]

[project.scripts]
scadustats = "scadustats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit real external services (e.g. YouTube)",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.hatch.build.targets.wheel]
packages = ["scadustats"]
