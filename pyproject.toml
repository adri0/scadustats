[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "scadustats"
dynamic = ["version"]
description = "Extract match data and statistics from Elden Ring Bingo Brawlers match videos"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Adriano Oliveira" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "yt-dlp>=2026.8",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "tesserocr>=2.7",
    "pillow>=10.0",
    "duckdb>=1.1",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/adri0/scadustats"
Issues = "https://github.com/adri0/scadustats/issues"

[project.optional-dependencies]
ejs = [
    "yt-dlp-ejs", # Potentially necessary if YT download fails
]

[project.scripts]
scadustats = "scadustats.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' -rx"
markers = [
    "integration: tests that hit real external services (e.g. YouTube)",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.hatch.build.targets.wheel]
packages = ["scadustats"]

[tool.hatch.version]
source = "vcs"
