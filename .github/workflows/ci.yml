name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not just the latest commit: hatch-vcs (see
          # [tool.hatch.version] in pyproject.toml) derives the package version from the
          # nearest git tag, which a shallow clone can't see.
          fetch-depth: 0

      - name: Install ffmpeg, tesseract and tesserocr requirements
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr libtesseract-dev libleptonica-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest

      - name: Run integration tests (excluding the YouTube download test)
        run: uv run pytest -m integration --deselect tests/video/test_download.py::test_download_video
